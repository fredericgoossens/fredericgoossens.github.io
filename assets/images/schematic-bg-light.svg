<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="dotgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#232A33" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- subtle dotted grid across the whole canvas -->
  <rect width="1440" height="900" fill="url(#dotgrid)"/>

  <!-- central processor / IC -->
  <g stroke="#232A33" stroke-width="1.5" stroke-opacity="0.12" fill="none">
    <rect x="570" y="300" width="300" height="300" rx="6"/>
    <!-- top pins -->
    <line x1="600" y1="300" x2="600" y2="280"/>
    <line x1="630" y1="300" x2="630" y2="280"/>
    <line x1="660" y1="300" x2="660" y2="280"/>
    <line x1="690" y1="300" x2="690" y2="280"/>
    <line x1="720" y1="300" x2="720" y2="280"/>
    <line x1="750" y1="300" x2="750" y2="280"/>
    <line x1="780" y1="300" x2="780" y2="280"/>
    <line x1="810" y1="300" x2="810" y2="280"/>
    <line x1="840" y1="300" x2="840" y2="280"/>
    <!-- bottom pins -->
    <line x1="600" y1="600" x2="600" y2="620"/>
    <line x1="630" y1="600" x2="630" y2="620"/>
    <line x1="660" y1="600" x2="660" y2="620"/>
    <line x1="690" y1="600" x2="690" y2="620"/>
    <line x1="720" y1="600" x2="720" y2="620"/>
    <line x1="750" y1="600" x2="750" y2="620"/>
    <line x1="780" y1="600" x2="780" y2="620"/>
    <line x1="810" y1="600" x2="810" y2="620"/>
    <line x1="840" y1="600" x2="840" y2="620"/>
    <!-- left pins -->
    <line x1="570" y1="330" x2="550" y2="330"/>
    <line x1="570" y1="360" x2="550" y2="360"/>
    <line x1="570" y1="390" x2="550" y2="390"/>
    <line x1="570" y1="420" x2="550" y2="420"/>
    <line x1="570" y1="450" x2="550" y2="450"/>
    <line x1="570" y1="480" x2="550" y2="480"/>
    <line x1="570" y1="510" x2="550" y2="510"/>
    <line x1="570" y1="540" x2="550" y2="540"/>
    <line x1="570" y1="570" x2="550" y2="570"/>
    <!-- right pins -->
    <line x1="870" y1="330" x2="890" y2="330"/>
    <line x1="870" y1="360" x2="890" y2="360"/>
    <line x1="870" y1="390" x2="890" y2="390"/>
    <line x1="870" y1="420" x2="890" y2="420"/>
    <line x1="870" y1="450" x2="890" y2="450"/>
    <line x1="870" y1="480" x2="890" y2="480"/>
    <line x1="870" y1="510" x2="890" y2="510"/>
    <line x1="870" y1="540" x2="890" y2="540"/>
    <line x1="870" y1="570" x2="890" y2="570"/>
  </g>

  <!-- lock icon inside the chip -->
  <g stroke="#232A33" stroke-width="2" stroke-opacity="0.1" fill="none" stroke-linecap="round">
    <rect x="675" y="440" width="90" height="70" rx="5"/>
    <path d="M690 440 V415 A30 30 0 0 1 750 415 V440" stroke-width="3"/>
  </g>

  <!-- left memory module -->
  <g stroke="#232A33" stroke-width="1.2" stroke-opacity="0.1" fill="none">
    <rect x="150" y="360" width="220" height="180" rx="4"/>
    <line x1="370" y1="390" x2="400" y2="390"/>
    <line x1="370" y1="420" x2="400" y2="420"/>
    <line x1="370" y1="450" x2="400" y2="450"/>
    <line x1="370" y1="480" x2="400" y2="480"/>
    <line x1="370" y1="510" x2="400" y2="510"/>
  </g>

  <!-- right memory module -->
  <g stroke="#232A33" stroke-width="1.2" stroke-opacity="0.1" fill="none">
    <rect x="1070" y="360" width="220" height="180" rx="4"/>
    <line x1="1070" y1="390" x2="1040" y2="390"/>
    <line x1="1070" y1="420" x2="1040" y2="420"/>
    <line x1="1070" y1="450" x2="1040" y2="450"/>
    <line x1="1070" y1="480" x2="1040" y2="480"/>
    <line x1="1070" y1="510" x2="1040" y2="510"/>
  </g>

  <!-- top connector strip -->
  <g stroke="#232A33" stroke-width="1" stroke-opacity="0.1" fill="none">
    <rect x="520" y="90" width="400" height="60" rx="3"/>
    <line x1="550" y1="150" x2="550" y2="170"/>
    <line x1="590" y1="150" x2="590" y2="170"/>
    <line x1="630" y1="150" x2="630" y2="170"/>
    <line x1="670" y1="150" x2="670" y2="170"/>
    <line x1="710" y1="150" x2="710" y2="170"/>
    <line x1="750" y1="150" x2="750" y2="170"/>
    <line x1="790" y1="150" x2="790" y2="170"/>
    <line x1="830" y1="150" x2="830" y2="170"/>
    <line x1="870" y1="150" x2="870" y2="170"/>
  </g>

  <!-- bottom connector strip -->
  <g stroke="#232A33" stroke-width="1" stroke-opacity="0.1" fill="none">
    <rect x="520" y="750" width="400" height="60" rx="3"/>
    <line x1="550" y1="750" x2="550" y2="730"/>
    <line x1="590" y1="750" x2="590" y2="730"/>
    <line x1="630" y1="750" x2="630" y2="730"/>
    <line x1="670" y1="750" x2="670" y2="730"/>
    <line x1="710" y1="750" x2="710" y2="730"/>
    <line x1="750" y1="750" x2="750" y2="730"/>
    <line x1="790" y1="750" x2="790" y2="730"/>
    <line x1="830" y1="750" x2="830" y2="730"/>
    <line x1="870" y1="750" x2="870" y2="730"/>
  </g>

  <!-- bus traces connecting modules -->
  <g stroke="#232A33" stroke-width="1.5" stroke-opacity="0.08" fill="none">
    <path d="M400 450 H550 M550 450 V450 H570"/>
    <path d="M1040 450 H890 M890 450 V450 H870"/>
    <path d="M720 280 V170 M720 170 H720"/>
    <path d="M720 620 V730 M720 730 H720"/>
  </g>

  <!-- additional angular traces -->
  <g stroke="#232A33" stroke-width="1" stroke-opacity="0.06" fill="none">
    <path d="M0 200 H250 M250 200 V330 H370"/>
    <path d="M1440 200 H1190 M1190 200 V330 H1070"/>
    <path d="M0 700 H250 M250 700 V570 H370"/>
    <path d="M1440 700 H1190 M1190 700 V570 H1070"/>
  </g>

  <!-- hex vias in corners -->
  <g stroke="#232A33" stroke-width="1" stroke-opacity="0.07" fill="none">
    <path d="M80 80 L95 68 L110 80 L110 100 L95 112 L80 100 Z"/>
    <path d="M1330 80 L1345 68 L1360 80 L1360 100 L1345 112 L1330 100 Z"/>
    <path d="M80 820 L95 808 L110 820 L110 840 L95 852 L80 840 Z"/>
    <path d="M1330 820 L1345 808 L1360 820 L1360 840 L1345 852 L1330 840 Z"/>
  </g>

  <!-- cyan nodes / test points -->
  <g fill="#0A729C" fill-opacity="0.25">
    <circle cx="400" cy="450" r="4"/>
    <circle cx="1040" cy="450" r="4"/>
    <circle cx="720" cy="170" r="4"/>
    <circle cx="720" cy="730" r="4"/>
    <circle cx="250" cy="200" r="3"/>
    <circle cx="1190" cy="200" r="3"/>
    <circle cx="250" cy="700" r="3"/>
    <circle cx="1190" cy="700" r="3"/>
    <circle cx="95" cy="90" r="3"/>
    <circle cx="1345" cy="90" r="3"/>
    <circle cx="95" cy="830" r="3"/>
    <circle cx="1345" cy="830" r="3"/>
  </g>

  <!-- faint labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="0.12em" fill="#232A33" fill-opacity="0.07" text-anchor="middle">
    <text x="720" y="335">CPU_CORE</text>
    <text x="260" y="395">RAM_0</text>
    <text x="1180" y="395">RAM_1</text>
    <text x="720" y="125">IO_BUS</text>
    <text x="720" y="790">PWR_RAIL</text>
    <text x="95" y="140">VIA_A0</text>
    <text x="1345" y="140">VIA_A1</text>
    <text x="95" y="800">VIA_B0</text>
    <text x="1345" y="800">VIA_B1</text>
  </g>
</svg>